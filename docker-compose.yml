services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yoursmmagent-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-yoursmmagent}:${POSTGRES_PASSWORD:-yoursmmsecret}@postgres:5432/${POSTGRES_DB:-yoursmmagent_db}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-please-change-this-jwt-secret-in-production}
      - COOKIE_SECRET=${COOKIE_SECRET:-please-change-this-cookie-secret-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: yoursmmagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yoursmmagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yoursmmsecret}
      POSTGRES_DB: ${POSTGRES_DB:-yoursmmagent_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yoursmmagent} -d ${POSTGRES_DB:-yoursmmagent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yoursmmagent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
