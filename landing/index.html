        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "FAQPage",
                "mainEntity": [
                    {
                        "@type": "Question",
                        "name": "What is YourSMMagent?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "YourSMMagent is an AI-powered customer support platform built specifically for SMM panel businesses. It lets you configure a dedicated AI support agent that assists customers through website chat, Telegram, and WhatsApp, using your business knowledge and, where supported, authorized panel API workflows."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "How does AI customer support work for an SMM panel?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "You configure the agent with your business information — services, policies, tone, and rules. It then answers common customer questions like order status, service details, and refill eligibility based on that configuration. For panel-related workflows such as order lookups, it uses a supported, authorized API connection. Anything it cannot resolve can be escalated to a human."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Is YourSMMagent an SMM panel?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "No. YourSMMagent is not an SMM panel and does not sell followers, likes, views, or any other engagement services. It is support software for businesses that already operate their own SMM panel or reseller business."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Can I integrate YourSMMagent with my existing SMM panel?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "YourSMMagent is designed to connect to your panel through supported API integrations. You provide your panel's API connection details during setup, and the available assistance — such as order status lookups — depends on what your panel's API supports and the permissions you grant."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Can the AI chatbot check customer order statuses?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Yes, when your workspace is connected to a supported panel API that allows authenticated order lookups. Order status assistance is one of the core use cases — the agent retrieves the status through the authorized connection and explains it to the customer. Without a connected API, it can still guide customers on how to check their orders."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Does YourSMMagent support Telegram and WhatsApp?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Yes. You can provide customer assistance through a dedicated Telegram bot and WhatsApp Business integrations, as well as an embeddable website chat widget, all managed from one central dashboard."
                        }
                    }
                ]
