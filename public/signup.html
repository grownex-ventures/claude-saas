<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — SupportBot</title>
  <meta name="description" content="Create your SupportBot account and start delivering automated 24/7 Telegram customer support." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    .auth-nav {
      width: 100%;
      max-width: 440px;
      margin-bottom: var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: var(--font-sm);
      margin-bottom: var(--space-4);
      line-height: var(--lh-normal);
    }

    .alert-error {
      background-color: var(--color-rose-muted);
      color: var(--color-rose);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .alert-success {
      background-color: var(--color-emerald-muted);
      color: var(--color-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .input-hint {
      display: block;
      margin-top: 0.35rem;
      font-size: var(--font-xs);
      color: var(--color-text-subtle);
      transition: color var(--transition-fast);
    }

    .hint-valid {
      color: var(--color-emerald);
    }

    .hint-invalid {
      color: var(--color-rose);
    }

    .auth-footer {
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border);
      text-align: center;
      font-size: var(--font-sm);
      color: var(--color-text-muted);
    }

    .auth-footer a {
      color: var(--color-accent-light);
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <a href="#main-signup" class="skip-link">Skip to registration form</a>
  <div class="auth-page-wrapper">
    <!-- Top Return Nav -->
    <div class="auth-nav">
      <a href="/" class="brand-logo" style="font-size: var(--font-h4);">
        <div class="brand-icon-box" style="width: 32px; height: 32px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="6" width="18" height="14" rx="4" fill="#ffffff" />
            <circle cx="8.5" cy="12" r="1.5" fill="#ea580c" />
            <circle cx="15.5" cy="12" r="1.5" fill="#ea580c" />
            <path d="M9 16C10 17 14 17 15 16" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" />
            <path d="M12 2V6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
            <circle cx="12" cy="2" r="1" fill="#ffffff" />
          </svg>
        </div>
        <span>SupportBot</span>
      </a>

      <a href="/" class="btn btn-ghost" style="font-size: var(--font-xs); padding: 0.4rem 0.8rem;">
        ← Home
      </a>
    </div>

    <!-- Centered / Bottom Sheet Card -->
    <main class="auth-card card-glass" id="main-signup">
      <div class="auth-sheet-handle" aria-hidden="true"></div>

      <div style="margin-bottom: var(--space-6); text-align: left;">
        <h1 style="font-size: var(--font-h2); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem;">Create your account</h1>
        <p style="font-size: var(--font-sm); color: var(--color-text-muted); margin: 0;">Start your automated multi-tenant Telegram support bot</p>
      </div>

      <div id="alertBox" class="alert alert-error" role="alert"></div>

      <form id="signupForm" novalidate>
        <!-- Email Input -->
        <div class="form-group">
          <label for="email" class="form-label">
            <span>Work Email</span>
          </label>
          <div class="input-icon-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com" required autocomplete="email" />
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="password" class="form-label">
            <span>Password</span>
          </label>
          <div class="input-icon-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" name="password" class="form-control has-right-icon" placeholder="••••••••" required autocomplete="new-password" aria-describedby="passwordHint" />
            <button type="button" class="input-icon-right" id="togglePasswordBtn" aria-label="Show password" aria-controls="password" aria-pressed="false">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="input-hint" id="passwordHint" aria-live="polite">Must be at least 8 characters.</span>
        </div>

        <!-- Confirm Password Input -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">
            <span>Confirm Password</span>
          </label>
          <div class="input-icon-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password" aria-describedby="confirmHint" />
          </div>
          <span class="input-hint" id="confirmHint" aria-live="polite" style="display: none;"></span>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="margin-top: var(--space-4);">
          Start Free Trial
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </main>
  </div>

  <script>
    // If already logged in, redirect directly to dashboard
    if (localStorage.getItem('supportbot_token')) {
      window.location.href = '/dashboard';
    }

    const form = document.getElementById('signupForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const passwordHint = document.getElementById('passwordHint');
    const confirmHint = document.getElementById('confirmHint');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      if (isPassword) {
        passwordInput.type = 'text';
        togglePasswordBtn.setAttribute('aria-pressed', 'true');
        togglePasswordBtn.setAttribute('aria-label', 'Hide password');
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passwordInput.type = 'password';
        togglePasswordBtn.setAttribute('aria-pressed', 'false');
        togglePasswordBtn.setAttribute('aria-label', 'Show password');
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    // Real-time password requirement indicator
    passwordInput.addEventListener('input', () => {
      const len = passwordInput.value.length;
      if (len === 0) {
        passwordHint.textContent = 'Must be at least 8 characters.';
        passwordHint.className = 'input-hint';
      } else if (len < 8) {
        passwordHint.textContent = `Must be at least 8 characters (${8 - len} more needed).`;
        passwordHint.className = 'input-hint hint-invalid';
      } else {
        passwordHint.textContent = '✓ Password length requirement met.';
        passwordHint.className = 'input-hint hint-valid';
      }
      checkMatch();
    });

    confirmInput.addEventListener('input', checkMatch);

    function checkMatch() {
      if (!confirmInput.value) {
        confirmHint.style.display = 'none';
        return;
      }
      confirmHint.style.display = 'block';
      if (confirmInput.value === passwordInput.value) {
        confirmHint.textContent = '✓ Passwords match.';
        confirmHint.className = 'input-hint hint-valid';
      } else {
        confirmHint.textContent = 'Passwords do not match yet.';
        confirmHint.className = 'input-hint hint-invalid';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert alert-error';
      alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (!email || !password || !confirmPassword) {
        alertBox.textContent = 'Please fill out all fields.';
        alertBox.style.display = 'block';
        return;
      }

      if (password.length < 8) {
        alertBox.textContent = 'Password must be at least 8 characters long.';
        alertBox.style.display = 'block';
        return;
      }

      if (password !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match. Please verify and try again.';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const response = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Failed to create account.');
        }

        // Save session JWT token in localStorage
        localStorage.setItem('supportbot_token', data.token);
        localStorage.setItem('supportbot_user', JSON.stringify(data.tenant));

        alertBox.className = 'alert alert-success';
        alertBox.textContent = 'Account created successfully! Redirecting to dashboard...';
        alertBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 600);
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = err.message || 'An error occurred during sign up.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Start Free Trial';
      }
    });
  </script>
</body>

</html>
