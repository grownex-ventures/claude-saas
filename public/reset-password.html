<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | YourSMMagent</title>
  <meta name="description" content="Set a new password for your YourSMMagent control center." />
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-xl);
    }

    .auth-input-wrapper {
      position: relative;
      margin-bottom: var(--space-4);
    }

    .auth-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--font-body);
      color: var(--color-text-main);
      background: var(--color-bg);
      outline: none;
      transition: all var(--transition-fast);
      box-sizing: border-box;
    }

    .auth-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-glow);
    }

    .auth-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--color-accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-body);
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .auth-btn:hover {
      background: var(--color-accent-hover);
    }

    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--font-xs);
      margin-bottom: var(--space-4);
      display: none;
    }

    .alert-danger {
      background: var(--color-rose-muted);
      color: var(--color-rose);
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: var(--color-emerald-muted);
      color: var(--color-emerald);
      border: 1px solid #bbf7d0;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <a href="/" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.65rem;">
          <svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true" style="border-radius: 8px;">
            <defs>
              <linearGradient id="ysmm-g-reset" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#4F46E5" />
                <stop offset="100%" stop-color="#2563EB" />
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="14" fill="url(#ysmm-g-reset)" />
            <circle cx="24" cy="28" r="4" fill="#FFFFFF" />
            <circle cx="40" cy="28" r="4" fill="#FFFFFF" />
            <path d="M22 40 C 26 44, 38 44, 42 40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
            <rect x="29" y="12" width="6" height="8" rx="3" fill="#A5B4FC" />
            <circle cx="32" cy="10" r="3" fill="#A5B4FC" />
          </svg>
          <span style="font-weight: 800; font-size: 1.25rem; letter-spacing: -0.02em; color: var(--color-text-main);">Your<span style="color: var(--color-accent);">SMM</span>agent</span>
        </a>
        <h1 style="font-size: var(--font-h3); font-weight: 800; margin-top: var(--space-4); margin-bottom: 0.25rem;">Create New Password</h1>
        <p style="font-size: var(--font-sm); color: var(--color-text-muted);">Enter a strong password of at least 8 characters.</p>
      </div>

      <div id="alertBox" class="alert alert-danger" role="alert"></div>

      <form id="resetForm" novalidate>
        <div class="auth-input-wrapper">
          <label for="newPassword" style="display: block; font-size: var(--font-xs); font-weight: 600; margin-bottom: 4px;">New Password</label>
          <input type="password" id="newPassword" name="newPassword" class="auth-input" required minlength="8" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <div class="auth-input-wrapper">
          <label for="confirmPassword" style="display: block; font-size: var(--font-xs); font-weight: 600; margin-bottom: 4px;">Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="auth-input" required minlength="8" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <button type="submit" id="submitBtn" class="auth-btn">
          Reset Password
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-4);">
        <a href="/login" style="font-size: var(--font-xs); font-weight: 600; color: var(--color-accent); text-decoration: none;">Back to login</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    // Extract token from query params
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      alertBox.textContent = 'Invalid or missing password reset link. Please request a new one.';
      alertBox.className = 'alert alert-danger';
      alertBox.style.display = 'block';
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword || newPassword.length < 8) {
        alertBox.textContent = 'Password must be at least 8 characters long.';
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'block';
        return;
      }

      if (newPassword !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating password...';

      try {
        const res = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Password reset failed.');
        }

        alertBox.textContent = '✓ ' + (data.message || 'Password reset successfully! Redirecting to login...');
        alertBox.className = 'alert alert-success';
        alertBox.style.display = 'block';
        form.reset();

        setTimeout(() => {
          window.location.href = '/login';
        }, 1500);
      } catch (err) {
        alertBox.textContent = err.message || 'Could not reset password. The link may have expired.';
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>

</html>
